<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مقایسه خودروهای ایرانی · Persian Cars Analysts</title>

    <!-- Vazir font -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet" />
    <!-- Chart.js for radar -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <style>
        :root {
            --bg-primary: #0d0d0d;
            --bg-secondary: #1a1a1a;
            --bg-card: #242424;
            --bg-hover: #2e2e2e;
            --text-primary: #f0f0f0;
            --text-secondary: #b0b0b0;
            --text-muted: #707070;
            --border-color: #333;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --accent: #f39c12;
            --accent-hover: #e67e22;
            --accent2: #3498db;
            --win: #2ecc71;
            --lose: #e74c3c;
            --radius: 16px;
            --transition: 0.3s ease;
            --font: 'Vazir', sans-serif;
        }

        [data-theme="light"] {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-hover: #f0f0f0;
            --text-primary: #1a1a1a;
            --text-secondary: #444444;
            --text-muted: #888888;
            --border-color: #e0e0e0;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --accent: #e67e22;
            --accent-hover: #d35400;
            --accent2: #2980b9;
            --win: #27ae60;
            --lose: #c0392b;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color var(--transition), color var(--transition);
            min-height: 100vh;
            padding: 20px;
        }

        a { text-decoration: none; color: inherit; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        .app {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
            border: 1px solid var(--border-color);
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-title small {
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-secondary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            font-family: var(--font);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition);
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover {
            background: var(--bg-hover);
            transform: translateY(-1px);
        }
        .btn-accent {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn-accent:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .theme-toggle {
            font-size: 1.2rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition);
            color: var(--text-primary);
        }
        .theme-toggle:hover {
            background: var(--bg-hover);
            transform: rotate(20deg);
        }

        /* Selectors */
        .selectors {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            margin-bottom: 28px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .selectors {
                grid-template-columns: 1fr;
            }
            .vs-badge {
                order: -1;
                margin: 0 auto;
            }
        }

        .select-card {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .select-card h3 {
            font-size: 1.05rem;
            margin-bottom: 14px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .select-card.car1 h3 { color: var(--accent); }
        .select-card.car2 h3 { color: var(--accent2); }

        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 0.9rem;
            outline: none;
            transition: border-color var(--transition);
            appearance: none;
            -webkit-appearance: none;
        }
        select:focus, input[type="text"]:focus {
            border-color: var(--accent);
        }

        .vs-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: var(--bg-card);
            border: 2px solid var(--accent);
            border-radius: 50%;
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--accent);
            box-shadow: var(--shadow);
            margin-top: 60px;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        /* Loading & Status */
        .status {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            font-size: 1rem;
        }
        .status.error { color: var(--lose); }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Comparison Result */
        .result {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .result.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header cards of two cars */
        .cars-header {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }
        @media (max-width: 640px) {
            .cars-header { grid-template-columns: 1fr; }
        }

        .car-preview {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .car-preview.car1 { border-top: 4px solid var(--accent); }
        .car-preview.car2 { border-top: 4px solid var(--accent2); }

        .car-preview .img-wrap {
            height: 180px;
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .car-preview .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .car-preview .img-placeholder {
            font-size: 4rem;
            color: var(--text-muted);
        }
        .car-preview .info {
            padding: 16px 18px 20px;
        }
        .car-preview .name {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .car-preview .meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .car-preview .score {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .car-preview.car2 .score { background: var(--accent2); }

        /* Spec table */
        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .spec-table-wrap {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 28px;
        }

        .spec-table {
            width: 100%;
            border-collapse: collapse;
        }
        .spec-table th,
        .spec-table td {
            padding: 12px 16px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }
        .spec-table th {
            background: var(--bg-card);
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .spec-table tr:last-child td { border-bottom: none; }
        .spec-table tr:hover td { background: var(--bg-hover); }

        .spec-table .label {
            text-align: right;
            color: var(--text-muted);
            font-weight: 500;
            white-space: nowrap;
        }
        .spec-table .val {
            font-weight: 600;
            color: var(--text-primary);
        }
        .spec-table .val.win {
            color: var(--win);
            position: relative;
        }
        .spec-table .val.win::after {
            content: ' ✓';
            font-size: 0.85em;
        }
        .spec-table .val.lose {
            color: var(--text-secondary);
        }
        .spec-table .val.tie {
            color: var(--text-primary);
        }

        /* Radar chart */
        .chart-section {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 28px;
        }
        .chart-wrapper {
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            height: 360px;
        }

        /* Winner summary */
        .winner-box {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 20px 24px;
            margin-bottom: 28px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        .winner-box h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }
        .winner-box .winner-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--win);
        }
        .winner-box .score-diff {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Key options */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }
        @media (max-width: 640px) {
            .options-grid { grid-template-columns: 1fr; }
        }
        .options-card {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 18px;
            box-shadow: var(--shadow);
        }
        .options-card h4 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: var(--accent);
        }
        .options-card.car2 h4 { color: var(--accent2); }
        .options-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .option-tag {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .footer a {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-title">
                ⚖️ مقایسه خودرو
                <small>Persian Cars Analysts</small>
            </div>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle" title="تغییر تم">🌙</button>
                <a href="virtualiza2_data.html" class="btn">← بازگشت به داشبورد</a>
            </div>
        </header>

        <!-- Selectors -->
        <div class="selectors" id="selectors">
            <div class="select-card car1">
                <h3>🚗 خودرو اول</h3>
                <div class="form-group">
                    <label>سازنده</label>
                    <select id="mfg1">
                        <option value="">همه سازندگان</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>مدل</label>
                    <select id="model1" disabled>
                        <option value="">ابتدا سازنده را انتخاب کنید</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>سال تولید</label>
                    <select id="year1" disabled>
                        <option value="">ابتدا مدل را انتخاب کنید</option>
                    </select>
                </div>
            </div>

            <div class="vs-badge">VS</div>

            <div class="select-card car2">
                <h3>🚙 خودرو دوم</h3>
                <div class="form-group">
                    <label>سازنده</label>
                    <select id="mfg2">
                        <option value="">همه سازندگان</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>مدل</label>
                    <select id="model2" disabled>
                        <option value="">ابتدا سازنده را انتخاب کنید</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>سال تولید</label>
                    <select id="year2" disabled>
                        <option value="">ابتدا مدل را انتخاب کنید</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-accent" id="compareBtn" disabled>🔍 شروع مقایسه</button>
            <button class="btn" id="swapBtn" title="جابه‌جایی دو خودرو">⇄ جابه‌جایی</button>
            <button class="btn" id="resetBtn">پاک کردن</button>
        </div>

        <!-- Status -->
        <div class="status" id="status">
            <div class="spinner"></div>
            در حال بارگذاری داده‌ها...
        </div>

        <!-- Result -->
        <div class="result" id="result">
            <!-- Winner summary -->
            <div class="winner-box" id="winnerBox"></div>

            <!-- Two car previews -->
            <div class="cars-header" id="carsHeader"></div>

            <!-- Spec comparison table -->
            <div class="section-title">📊 مقایسه مشخصات فنی</div>
            <div class="spec-table-wrap">
                <table class="spec-table" id="specTable">
                    <thead>
                        <tr>
                            <th class="label">مشخصه</th>
                            <th id="thCar1">خودرو ۱</th>
                            <th id="thCar2">خودرو ۲</th>
                        </tr>
                    </thead>
                    <tbody id="specBody"></tbody>
                </table>
            </div>

            <!-- Radar chart -->
            <div class="chart-section">
                <div class="section-title">🕸️ نمودار راداری (نرمال‌شده)</div>
                <div class="chart-wrapper">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>

            <!-- Key options -->
            <div class="section-title">✨ امکانات و تجهیزات</div>
            <div class="options-grid" id="optionsGrid"></div>
        </div>

        <footer class="footer">
            داده‌ها از پروژه
            <a href="https://github.com/LiamTaghizadeh/Persian_cars_Analysts" target="_blank">Persian Cars Analysts</a>
            · ۱۳۸۰ تا ۱۴۰۵
        </footer>
    </div>

    <script>
        // ============================================================
        // Config
        // ============================================================
        const CSV_URL = 'https://raw.githubusercontent.com/LiamTaghizadeh/Persian_cars_Analysts/main/Phase_1/iranian_cars_final.csv';

        // Specs definition: key, label, unit, higherIsBetter
        const SPECS = [
            { key: 'Power_hp',              label: 'قدرت موتور',           unit: 'اسب',     higher: true  },
            { key: 'Torque_Nm',             label: 'گشتاور',               unit: 'نیوتن‌متر', higher: true  },
            { key: 'Fuel_Consumption_L100km', label: 'مصرف سوخت',         unit: 'لیتر/۱۰۰کم', higher: false },
            { key: 'Acceleration_0_100_s',  label: 'شتاب ۰ تا ۱۰۰',        unit: 'ثانیه',   higher: false },
            { key: 'Top_Speed_kmh',         label: 'حداکثر سرعت',          unit: 'کم/س',    higher: true  },
            { key: 'CO2_Emission_g_km',     label: 'آلایندگی CO₂',         unit: 'گرم/کم',  higher: false },
            { key: 'Score',                 label: 'امتیاز کلی',            unit: '/۱۰',     higher: true  },
        ];

        const EXTRA_FIELDS = [
            { key: 'Fuel_Type',          label: 'نوع سوخت' },
            { key: 'Engine_Type',        label: 'نوع موتور' },
            { key: 'Emission_Standard',  label: 'استاندارد آلایندگی' },
            { key: 'Year',               label: 'سال میلادی' },
            { key: 'Shamsi_Year',        label: 'سال شمسی' },
            { key: 'Manufacturer',       label: 'سازنده' },
        ];

        // ============================================================
        // State
        // ============================================================
        let allCars = [];
        let radarChart = null;

        // ============================================================
        // Theme
        // ============================================================
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            document.getElementById('themeToggle').textContent = next === 'dark' ? '🌙' : '☀️';
            if (radarChart) updateRadarColors();
        }

        // ============================================================
        // CSV Parser (simple, handles quoted fields)
        // ============================================================
        function parseCSV(text) {
            const lines = text.trim().split(/\r?\n/);
            if (lines.length < 2) return [];
            const headers = splitCSVLine(lines[0]);
            const rows = [];
            for (let i = 1; i < lines.length; i++) {
                const cols = splitCSVLine(lines[i]);
                if (cols.length < headers.length) continue;
                const obj = {};
                headers.forEach((h, idx) => {
                    let val = cols[idx] ?? '';
                    // numeric fields
                    if (['Year','Shamsi_Year','Power_hp','Torque_Nm','Fuel_Consumption_L100km',
                         'Acceleration_0_100_s','Top_Speed_kmh','CO2_Emission_g_km','Score'].includes(h)) {
                        val = parseFloat(val);
                        if (isNaN(val)) val = null;
                    }
                    obj[h] = val;
                });
                rows.push(obj);
            }
            return rows;
        }

        function splitCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (ch === '"') {
                    inQuotes = !inQuotes;
                } else if (ch === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += ch;
                }
            }
            result.push(current.trim());
            return result;
        }

        // ============================================================
        // Load data
        // ============================================================
        async function loadData() {
            const status = document.getElementById('status');
            try {
                const res = await fetch(CSV_URL);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const text = await res.text();
                allCars = parseCSV(text);
                if (!allCars.length) throw new Error('داده خالی است');
                status.style.display = 'none';
                populateManufacturers();
                document.getElementById('compareBtn').disabled = false;
            } catch (err) {
                status.innerHTML = `<div class="status error">❌ خطا در بارگذاری داده: ${err.message}<br>
                    <small>لطفاً اتصال اینترنت را بررسی کنید یا صفحه را رفرش کنید.</small></div>`;
            }
        }

        // ============================================================
        // Populate selects
        // ============================================================
        function unique(arr) {
            return [...new Set(arr)].filter(Boolean).sort((a, b) => {
                if (typeof a === 'number') return a - b;
                return String(a).localeCompare(String(b), 'fa');
            });
        }

        function populateManufacturers() {
            const mfgs = unique(allCars.map(c => c.Manufacturer));
            ['mfg1', 'mfg2'].forEach(id => {
                const sel = document.getElementById(id);
                sel.innerHTML = '<option value="">همه سازندگان</option>';
                mfgs.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m;
                    opt.textContent = m;
                    sel.appendChild(opt);
                });
            });
        }

        function populateModels(side) {
            const mfg = document.getElementById('mfg' + side).value;
            const modelSel = document.getElementById('model' + side);
            const yearSel = document.getElementById('year' + side);

            let filtered = allCars;
            if (mfg) filtered = filtered.filter(c => c.Manufacturer === mfg);

            const models = unique(filtered.map(c => c.Model));
            modelSel.innerHTML = '<option value="">انتخاب مدل...</option>';
            models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                modelSel.appendChild(opt);
            });
            modelSel.disabled = false;
            yearSel.innerHTML = '<option value="">ابتدا مدل را انتخاب کنید</option>';
            yearSel.disabled = true;
            updateCompareBtn();
        }

        function populateYears(side) {
            const mfg = document.getElementById('mfg' + side).value;
            const model = document.getElementById('model' + side).value;
            const yearSel = document.getElementById('year' + side);

            let filtered = allCars.filter(c => c.Model === model);
            if (mfg) filtered = filtered.filter(c => c.Manufacturer === mfg);

            const years = unique(filtered.map(c => c.Year)).sort((a, b) => b - a); // newest first
            yearSel.innerHTML = '<option value="">انتخاب سال...</option>';
            years.forEach(y => {
                const car = filtered.find(c => c.Year === y);
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = `${y} (${car?.Shamsi_Year || ''})`;
                yearSel.appendChild(opt);
            });
            yearSel.disabled = false;
            updateCompareBtn();
        }

        function getSelectedCar(side) {
            const mfg = document.getElementById('mfg' + side).value;
            const model = document.getElementById('model' + side).value;
            const year = parseFloat(document.getElementById('year' + side).value);
            if (!model || !year) return null;
            return allCars.find(c =>
                c.Model === model &&
                c.Year === year &&
                (!mfg || c.Manufacturer === mfg)
            ) || null;
        }

        function updateCompareBtn() {
            const c1 = getSelectedCar(1);
            const c2 = getSelectedCar(2);
            document.getElementById('compareBtn').disabled = !(c1 && c2);
        }

        // ============================================================
        // Compare
        // ============================================================
        function doCompare() {
            const car1 = getSelectedCar(1);
            const car2 = getSelectedCar(2);
            if (!car1 || !car2) return;

            document.getElementById('result').classList.add('active');
            renderPreviews(car1, car2);
            renderSpecTable(car1, car2);
            renderWinner(car1, car2);
            renderOptions(car1, car2);
            renderRadar(car1, car2);

            // scroll to result
            document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function renderPreviews(car1, car2) {
            const container = document.getElementById('carsHeader');
            container.innerHTML = [car1, car2].map((car, i) => {
                const cls = i === 0 ? 'car1' : 'car2';
                const img = car.Image_URL && car.Image_URL !== 'N/A'
                    ? `<img src="${car.Image_URL}" alt="${car.Model}" onerror="this.parentElement.innerHTML='<div class=\\'img-placeholder\\'>🚗</div>'">`
                    : `<div class="img-placeholder">🚗</div>`;
                return `
                    <div class="car-preview ${cls}">
                        <div class="img-wrap">${img}</div>
                        <div class="info">
                            <div class="name">${car.Model}</div>
                            <div class="meta">${car.Manufacturer} · ${car.Year} (${car.Shamsi_Year})</div>
                            <span class="score">⭐ ${car.Score != null ? car.Score : '—'} / ۱۰</span>
                        </div>
                    </div>`;
            }).join('');
        }

        function fmt(val, unit) {
            if (val == null || isNaN(val)) return '—';
            return `${val} ${unit || ''}`.trim();
        }

        function renderSpecTable(car1, car2) {
            document.getElementById('thCar1').textContent = car1.Model;
            document.getElementById('thCar2').textContent = car2.Model;

            const tbody = document.getElementById('specBody');
            let html = '';

            // Extra info rows first
            EXTRA_FIELDS.forEach(f => {
                html += `<tr>
                    <td class="label">${f.label}</td>
                    <td class="val">${car1[f.key] ?? '—'}</td>
                    <td class="val">${car2[f.key] ?? '—'}</td>
                </tr>`;
            });

            // Numeric specs with win/lose
            SPECS.forEach(s => {
                const v1 = car1[s.key];
                const v2 = car2[s.key];
                let cls1 = 'tie', cls2 = 'tie';
                if (v1 != null && v2 != null && !isNaN(v1) && !isNaN(v2)) {
                    if (s.higher) {
                        if (v1 > v2) { cls1 = 'win'; cls2 = 'lose'; }
                        else if (v2 > v1) { cls2 = 'win'; cls1 = 'lose'; }
                    } else {
                        if (v1 < v2) { cls1 = 'win'; cls2 = 'lose'; }
                        else if (v2 < v1) { cls2 = 'win'; cls1 = 'lose'; }
                    }
                }
                html += `<tr>
                    <td class="label">${s.label}</td>
                    <td class="val ${cls1}">${fmt(v1, s.unit)}</td>
                    <td class="val ${cls2}">${fmt(v2, s.unit)}</td>
                </tr>`;
            });

            tbody.innerHTML = html;
        }

        function renderWinner(car1, car2) {
            const box = document.getElementById('winnerBox');
            let wins1 = 0, wins2 = 0;
            SPECS.forEach(s => {
                const v1 = car1[s.key], v2 = car2[s.key];
                if (v1 == null || v2 == null || isNaN(v1) || isNaN(v2)) return;
                if (s.higher) {
                    if (v1 > v2) wins1++;
                    else if (v2 > v1) wins2++;
                } else {
                    if (v1 < v2) wins1++;
                    else if (v2 < v1) wins2++;
                }
            });

            // Score is the main tie-breaker
            const s1 = car1.Score ?? 0;
            const s2 = car2.Score ?? 0;

            let winnerText, diffText;
            if (wins1 > wins2 || (wins1 === wins2 && s1 > s2)) {
                winnerText = `🏆 ${car1.Model} برنده است`;
                diffText = `${wins1} برتری فنی در برابر ${wins2}`;
            } else if (wins2 > wins1 || (wins1 === wins2 && s2 > s1)) {
                winnerText = `🏆 ${car2.Model} برنده است`;
                diffText = `${wins2} برتری فنی در برابر ${wins1}`;
            } else {
                winnerText = '⚖️ مساوی';
                diffText = `هر دو خودرو در ${wins1} مشخصه برتری دارند`;
            }

            box.innerHTML = `
                <h3>نتیجه مقایسه فنی</h3>
                <div class="winner-name">${winnerText}</div>
                <div class="score-diff">${diffText} · امتیاز: ${s1} در برابر ${s2}</div>
            `;
        }

        function renderOptions(car1, car2) {
            const grid = document.getElementById('optionsGrid');
            const makeTags = (str) => {
                if (!str || str === 'N/A') return '<span class="option-tag">اطلاعاتی ثبت نشده</span>';
                return str.split(/[,،]/).map(t => t.trim()).filter(Boolean)
                    .map(t => `<span class="option-tag">${t}</span>`).join('');
            };
            grid.innerHTML = `
                <div class="options-card car1">
                    <h4>${car1.Model}</h4>
                    <div class="options-list">${makeTags(car1.Key_Options)}</div>
                </div>
                <div class="options-card car2">
                    <h4>${car2.Model}</h4>
                    <div class="options-list">${makeTags(car2.Key_Options)}</div>
                </div>
            `;
        }

        // ============================================================
        // Radar chart (normalized 0-100)
        // ============================================================
        function normalize(val, min, max, higherIsBetter) {
            if (val == null || isNaN(val) || max === min) return 50;
            let n = (val - min) / (max - min);
            if (!higherIsBetter) n = 1 - n;
            return Math.round(Math.max(0, Math.min(100, n * 100)));
        }

        function renderRadar(car1, car2) {
            const labels = SPECS.map(s => s.label);
            // Global min/max from all data for fair normalization
            const ranges = SPECS.map(s => {
                const vals = allCars.map(c => c[s.key]).filter(v => v != null && !isNaN(v));
                return { min: Math.min(...vals), max: Math.max(...vals) };
            });

            const data1 = SPECS.map((s, i) => normalize(car1[s.key], ranges[i].min, ranges[i].max, s.higher));
            const data2 = SPECS.map((s, i) => normalize(car2[s.key], ranges[i].min, ranges[i].max, s.higher));

            const ctx = document.getElementById('radarChart').getContext('2d');
            if (radarChart) radarChart.destroy();

            const isDark = (document.documentElement.getAttribute('data-theme') || 'dark') === 'dark';
            const textColor = isDark ? '#b0b0b0' : '#444';
            const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)';

            radarChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels,
                    datasets: [
                        {
                            label: car1.Model,
                            data: data1,
                            borderColor: '#f39c12',
                            backgroundColor: 'rgba(243, 156, 18, 0.2)',
                            pointBackgroundColor: '#f39c12',
                            pointBorderColor: '#fff',
                            borderWidth: 2,
                        },
                        {
                            label: car2.Model,
                            data: data2,
                            borderColor: '#3498db',
                            backgroundColor: 'rgba(52, 152, 219, 0.2)',
                            pointBackgroundColor: '#3498db',
                            pointBorderColor: '#fff',
                            borderWidth: 2,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: textColor,
                                font: { family: 'Vazir', size: 13 },
                                padding: 16
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => `${ctx.dataset.label}: ${ctx.raw}/100`
                            }
                        }
                    },
                    scales: {
                        r: {
                            min: 0,
                            max: 100,
                            ticks: {
                                stepSize: 20,
                                color: textColor,
                                backdropColor: 'transparent',
                                font: { family: 'Vazir', size: 10 }
                            },
                            pointLabels: {
                                color: textColor,
                                font: { family: 'Vazir', size: 12 }
                            },
                            grid: { color: gridColor },
                            angleLines: { color: gridColor }
                        }
                    }
                }
            });
        }

        function updateRadarColors() {
            if (!radarChart) return;
            const isDark = (document.documentElement.getAttribute('data-theme') || 'dark') === 'dark';
            const textColor = isDark ? '#b0b0b0' : '#444';
            const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)';
            radarChart.options.plugins.legend.labels.color = textColor;
            radarChart.options.scales.r.ticks.color = textColor;
            radarChart.options.scales.r.pointLabels.color = textColor;
            radarChart.options.scales.r.grid.color = gridColor;
            radarChart.options.scales.r.angleLines.color = gridColor;
            radarChart.update();
        }

        // ============================================================
        // Events
        // ============================================================
        document.getElementById('mfg1').addEventListener('change', () => populateModels(1));
        document.getElementById('mfg2').addEventListener('change', () => populateModels(2));
        document.getElementById('model1').addEventListener('change', () => populateYears(1));
        document.getElementById('model2').addEventListener('change', () => populateYears(2));
        document.getElementById('year1').addEventListener('change', updateCompareBtn);
        document.getElementById('year2').addEventListener('change', updateCompareBtn);

        document.getElementById('compareBtn').addEventListener('click', doCompare);

        document.getElementById('swapBtn').addEventListener('click', () => {
            const ids = ['mfg', 'model', 'year'];
            ids.forEach(prefix => {
                const a = document.getElementById(prefix + '1');
                const b = document.getElementById(prefix + '2');
                // We need to carefully swap values & options
                const tmpVal = a.value;
                const tmpHTML = a.innerHTML;
                const tmpDisabled = a.disabled;
                a.innerHTML = b.innerHTML;
                a.value = b.value;
                a.disabled = b.disabled;
                b.innerHTML = tmpHTML;
                b.value = tmpVal;
                b.disabled = tmpDisabled;
            });
            updateCompareBtn();
            if (!document.getElementById('compareBtn').disabled) doCompare();
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            ['1', '2'].forEach(side => {
                document.getElementById('mfg' + side).value = '';
                document.getElementById('model' + side).innerHTML = '<option value="">ابتدا سازنده را انتخاب کنید</option>';
                document.getElementById('model' + side).disabled = true;
                document.getElementById('year' + side).innerHTML = '<option value="">ابتدا مدل را انتخاب کنید</option>';
                document.getElementById('year' + side).disabled = true;
            });
            document.getElementById('result').classList.remove('active');
            document.getElementById('compareBtn').disabled = true;
            if (radarChart) { radarChart.destroy(); radarChart = null; }
        });

        document.getElementById('themeToggle').addEventListener('click', toggleTheme);

        // Init
        document.documentElement.setAttribute('data-theme', 'dark');
        loadData();
    </script>
</body>
</html>
