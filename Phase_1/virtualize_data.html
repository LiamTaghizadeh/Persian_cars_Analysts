<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>خودروهای ایرانی</title>

    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet" />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js">
    </script>

    <style>
        /* ===== CSS Variables (Themes) ===== */
        :root {
            --bg-primary: #0d0d0d;
            --bg-secondary: #1a1a1a;
            --bg-card: #242424;
            --bg-hover: #2e2e2e;
            --text-primary: #f0f0f0;
            --text-secondary: #b0b0b0;
            --text-muted: #707070;
            --border-color: #333;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --accent: #f39c12;
            --accent-hover: #e67e22;
            --radius: 16px;
            --transition: 0.3s ease;
            --font: 'Vazir', sans-serif;
        }

        [data-theme="light"] {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-hover: #f0f0f0;
            --text-primary: #1a1a1a;
            --text-secondary: #444444;
            --text-muted: #888888;
            --border-color: #e0e0e0;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --accent: #e67e22;
            --accent-hover: #d35400;
        }

        /* ===== Reset & Base ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color var(--transition), color var(--transition);
            min-height: 100vh;
            padding: 20px;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }

        /* ===== App Container ===== */
        .app {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* ===== Header ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 12px;
            border: 1px solid var(--border-color);
            transition: background var(--transition), border var(--transition);
        }

        .header-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-title small {
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text-secondary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            font-family: var(--font);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition);
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover {
            background: var(--bg-hover);
            transform: translateY(-1px);
        }
        .btn-accent {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn-accent:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        .btn-back {
            background: transparent;
            border-color: transparent;
            padding: 8px 12px;
        }
        .btn-back:hover {
            background: var(--bg-hover);
        }

        .theme-toggle {
            font-size: 1.2rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition);
            color: var(--text-primary);
        }
        .theme-toggle:hover {
            background: var(--bg-hover);
            transform: rotate(20deg);
        }

        /* ===== Views ===== */
        .view {
            display: none;
            animation: fadeIn 0.35s ease;
        }
        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== Home View ===== */
        .home-stats {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }
        .stat-badge {
            background: var(--bg-secondary);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: var(--text-secondary);
            transition: background var(--transition);
        }
        .stat-badge strong {
            color: var(--text-primary);
            font-weight: 700;
        }

        .manufacturer-group {
            margin-bottom: 36px;
        }
        .manufacturer-group h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 16px;
            padding-right: 4px;
            border-right: 4px solid var(--accent);
            padding-right: 12px;
        }

        .car-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 18px;
        }

        .car-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 18px 16px 20px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all var(--transition);
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .car-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow);
            border-color: var(--accent);
            background: var(--bg-hover);
        }
        .car-card .car-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            background: var(--bg-secondary);
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }
        .car-card .car-img-placeholder {
            width: 100%;
            height: 120px;
            border-radius: 10px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }
        .car-card .car-name {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .car-card .car-manufacturer {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .car-card .car-years {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 6px;
        }
        .car-card .car-score {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            background: var(--accent);
            color: #fff;
        }

        /* ===== Model Detail View ===== */
        .detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }
        .detail-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .detail-header h1 small {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-secondary);
        }

        .year-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .year-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: all var(--transition);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .year-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
            border-color: var(--accent);
        }
        .year-card .year-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        .year-card .year-img-placeholder {
            width: 100%;
            height: 160px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }
        .year-card .year-body {
            padding: 16px 18px 18px;
        }
        .year-card .year-badge {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .year-card .year-specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 12px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 6px;
        }
        .year-card .year-specs span {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            border-bottom: 1px dashed var(--border-color);
        }
        .year-card .year-specs span:last-child {
            border-bottom: none;
        }
        .year-card .year-specs .label {
            color: var(--text-muted);
        }
        .year-card .year-specs .value {
            color: var(--text-primary);
            font-weight: 500;
        }

        /* ===== Analysis View ===== */
        .analysis-container {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 24px 28px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: background var(--transition);
        }
        .analysis-container .analysis-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .analysis-container .analysis-header h2 {
            font-size: 1.4rem;
            font-weight: 600;
        }
        .analysis-container .analysis-header .sub {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .chart-wrapper {
            position: relative;
            height: 320px;
            margin: 16px 0 20px;
        }

        .metric-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .metric-selector .btn {
            font-size: 0.78rem;
            padding: 6px 16px;
            border-radius: 20px;
        }
        .metric-selector .btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .analysis-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }
        .analysis-stats .stat-item {
            text-align: center;
        }
        .analysis-stats .stat-item .num {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent);
        }
        .analysis-stats .stat-item .lbl {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            .header {
                padding: 12px 16px;
            }
            .header-title {
                font-size: 1.2rem;
            }
            .header-title small {
                font-size: 0.7rem;
            }
            .car-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
            }
            .year-grid {
                grid-template-columns: 1fr 1fr;
                gap: 14px;
            }
            .analysis-container {
                padding: 16px;
            }
            .chart-wrapper {
                height: 240px;
            }
            .detail-header h1 {
                font-size: 1.3rem;
            }
            .year-card .year-specs {
                grid-template-columns: 1fr;
                gap: 2px;
            }
            .analysis-stats {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 480px) {
            .year-grid {
                grid-template-columns: 1fr;
            }
            .car-grid {
                grid-template-columns: 1fr 1fr;
            }
            .header-actions .btn span {
                display: none;
            }
            .stat-badge {
                font-size: 0.7rem;
                padding: 6px 14px;
            }
            .analysis-stats {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* ===== Loading ===== */
        .loader {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .loader .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== Utilities ===== */
        .text-muted {
            color: var(--text-muted);
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .flex-center {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .gap-4 {
            gap: 4px;
        }
    </style>
</head>

        // ================================================================
        //  CSV PARSER (RFC4180-aware — respects quoted fields containing commas)
        // ================================================================
        // نکته مهم: پارس‌کننده قبلی برنامه فقط با split(',') کار می‌کرد و چون
        // ستون‌هایی مثل Engine_Type و Key_Options مقادیر کوما-دار داخل کوتیشن
        // دارند (مثلاً "1.6L I4, 8-valve")، تمام ستون‌های بعدی (به‌خصوص قدرت
        // موتور و امتیاز) به اشتباه جابه‌جا خوانده می‌شدند. این نسخه هر خط را
        // با در نظر گرفتن کوتیشن‌ها به‌درستی می‌شکافد.
        function parseCSVLine(line) {
            const result = [];
            let cur = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (inQuotes) {
                    if (ch === '"') {
                        if (line[i + 1] === '"') { cur += '"'; i++; }
                        else { inQuotes = false; }
                    } else {
                        cur += ch;
                    }
                } else {
                    if (ch === '"') {
                        inQuotes = true;
                    } else if (ch === ',') {
                        result.push(cur);
                        cur = '';
                    } else {
                        cur += ch;
                    }
                }
            }
            result.push(cur);
            return result.map(s => s.trim());
        }

        // ================================================================
        //  LOAD & PARSE CSV
        // ================================================================
        async function loadData() {
            try {
                const text = CSV_DATA;
                const lines = text.split('\n').map(l => l.replace(/\r$/, '')).filter(line => line.trim());
                if (lines.length < 2) throw new Error('CSV خالی است');

                const headers = parseCSVLine(lines[0]);
                // find column indices
                const idx = {
                    year: headers.indexOf('Year'),
                    shamsi: headers.indexOf('Shamsi_Year'),
                    manufacturer: headers.indexOf('Manufacturer'),
                    model: headers.indexOf('Model'),
                    fuel: headers.indexOf('Fuel_Type'),
                    engine: headers.indexOf('Engine_Type'),
                    power: headers.indexOf('Power_hp'),
                    torque: headers.indexOf('Torque_Nm'),
                    consumption: headers.indexOf('Fuel_Consumption_L100km'),
                    accel: headers.indexOf('Acceleration_0_100_s'),
                    topSpeed: headers.indexOf('Top_Speed_kmh'),
                    co2: headers.indexOf('CO2_Emission_g_km'),
                    standard: headers.indexOf('Emission_Standard'),
                    score: headers.indexOf('Score'),
                    options: headers.indexOf('Key_Options'),
                    image: headers.indexOf('Image_URL'),
                };

                for (let i = 1; i < lines.length; i++) {
                    const cols = parseCSVLine(lines[i]);
                    if (cols.length < headers.length) continue;
                    const car = {
                        year: parseInt(cols[idx.year], 10) || 0,
                        shamsi: cols[idx.shamsi] || '',
                        manufacturer: cols[idx.manufacturer] || '',
                        model: cols[idx.model] || '',
                        fuel: cols[idx.fuel] || '',
                        engine: cols[idx.engine] || '',
                        power: parseFloat(cols[idx.power]) || 0,
                        torque: parseFloat(cols[idx.torque]) || 0,
                        consumption: parseFloat(cols[idx.consumption]) || 0,
                        accel: parseFloat(cols[idx.accel]) || 0,
                        topSpeed: parseFloat(cols[idx.topSpeed]) || 0,
                        co2: parseFloat(cols[idx.co2]) || 0,
                        standard: cols[idx.standard] || '',
                        score: parseFloat(cols[idx.score]) || 0,
                        options: cols[idx.options] || '',
                        image: cols[idx.image] || 'N/A',
                    };
                    // skip invalid
                    if (!car.model || !car.manufacturer) continue;
                    allCars.push(car);
                    manufacturers.add(car.manufacturer);
                }

                // build models map
                modelsMap = {};
                allCars.forEach((car, index) => {
                    const key = car.model;
                    if (!modelsMap[key]) modelsMap[key] = [];
                    modelsMap[key].push(index);
                });

                return true;
            } catch (err) {
                console.error('Error loading data:', err);
                homeContent.innerHTML =
                    `<div class="loader" style="color:var(--text-secondary);"><p>⚠️ خطا در بارگذاری داده‌ها</p><p style="font-size:0.85rem;">${err.message}</p></div>`;
                return false;
            }
        }

        // ================================================================
        //  RENDER: YEAR-BY-YEAR TREND (HOME OVERVIEW CHART)
        // ================================================================
        // این چارت روند کلی صنعت خودروی ایران را به تفکیک سال نشان می‌دهد
        // (میانگین گرفته‌شده از تمام مدل‌ها/تولیدکنندگان در هر سال).
        let trendActiveMetric = null;

        function renderTrend() {
            // گروه‌بندی رکوردها بر اساس سال و محاسبه‌ی میانگین هر شاخص در آن سال
            const years = Array.from(new Set(allCars.map(c => c.year))).sort((a, b) => a - b);

            const avgByYear = (field) => years.map(y => {
                const rows = allCars.filter(c => c.year === y);
                return rows.reduce((s, c) => s + c[field], 0) / (rows.length || 1);
            });
            const countByYear = () => years.map(y => allCars.filter(c => c.year === y).length);

            const trendMetrics = {
                'میانگین امتیاز': { data: avgByYear('score'), unit: '/10', color: '#1abc9c' },
                'میانگین قدرت (hp)': { data: avgByYear('power'), unit: 'hp', color: '#e74c3c' },
                'میانگین گشتاور (Nm)': { data: avgByYear('torque'), unit: 'Nm', color: '#3498db' },
                'میانگین مصرف سوخت (L/100km)': { data: avgByYear('consumption'), unit: 'L/100km', color: '#2ecc71' },
                'میانگین CO₂ (g/km)': { data: avgByYear('co2'), unit: 'g/km', color: '#e67e22' },
                'تعداد مدل‌های عرضه‌شده': { data: countByYear(), unit: 'مدل', color: '#9b59b6' },
            };

            const metricKeys = Object.keys(trendMetrics);
            if (!trendActiveMetric || !trendMetrics[trendActiveMetric]) {
                trendActiveMetric = metricKeys[0];
            }

            trendContainer.innerHTML = `
                <div class="analysis-header">
                    <div>
                        <h2>📆 روند صنعت خودروی ایران به تفکیک سال</h2>
                        <div class="sub">میانگین/مجموع تمام مدل‌ها در هر سال · ${years[0]} تا ${years[years.length-1]}</div>
                    </div>
                </div>
                <div class="metric-selector" id="trendMetricSelector">
                    ${metricKeys.map(key => `
                        <button class="btn ${key === trendActiveMetric ? 'active' : ''}" data-metric="${key}">${key}</button>
                    `).join('')}
                </div>
                <div class="chart-wrapper">
                    <canvas id="trendChartCanvas"></canvas>
                </div>
            `;

            const ctx = document.getElementById('trendChartCanvas').getContext('2d');
            if (trendChart) { trendChart.destroy(); trendChart = null; }

            const isDark = getTheme() === 'dark';
            const textColor = isDark ? '#f0f0f0' : '#1a1a1a';
            const gridColor = isDark ? '#333' : '#e0e0e0';

            function buildTrendChart(metricKey) {
                const metric = trendMetrics[metricKey];
                const isScore = metric.unit === '/10';
                const yScale = isScore
                    ? { min: 0, max: 10 }
                    : { beginAtZero: true, suggestedMax: Math.max(...metric.data) * 1.15 || 1 };

                trendChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: years,
                        datasets: [{
                            label: metricKey,
                            data: metric.data,
                            backgroundColor: metric.color + 'aa',
                            borderColor: metric.color,
                            borderWidth: 1.5,
                            borderRadius: 4,
                            maxBarThickness: 34,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: {
                                labels: { color: textColor, font: { family: 'Vazir', size: 13 } }
                            },
                            tooltip: {
                                mode: 'index',
                                intersect: false,
                                titleFont: { family: 'Vazir' },
                                bodyFont: { family: 'Vazir' },
                                callbacks: {
                                    title: function(items) { return 'سال ' + items[0].label; },
                                    label: function(context) {
                                        const val = context.parsed.y;
                                        const formatted = Number.isInteger(val) ? val : val.toFixed(1);
                                        return context.dataset.label + ': ' + formatted + ' ' + (metric.unit || '');
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                ticks: { color: textColor, font: { family: 'Vazir' } },
                                grid: { display: false },
                                title: { display: true, text: 'سال', color: textColor, font: { family: 'Vazir' } }
                            },
                            y: {
                                ...yScale,
                                ticks: {
                                    color: textColor,
                                    font: { family: 'Vazir' },
                                    stepSize: isScore ? 1 : undefined,
                                },
                                grid: { color: gridColor },
                                title: { display: true, text: metric.unit || '', color: textColor, font: { family: 'Vazir' } }
                            }
                        }
                    }
                });
            }

            buildTrendChart(trendActiveMetric);

            document.querySelectorAll('#trendMetricSelector .btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#trendMetricSelector .btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    trendActiveMetric = this.dataset.metric;
                    if (trendChart) { trendChart.destroy(); trendChart = null; }
                    buildTrendChart(trendActiveMetric);
                });
            });
        }

        // ================================================================

                return;

                return;

            analysisTitle.textContent = modelName;
            analysisSub.textContent = `· ${selected.manufacturer} · ${year} (${selected.shamsi})`;

            // Prepare chart data
            const years = cars.map(c => c.year);
            const powerData = cars.map(c => c.power);
            const torqueData = cars.map(c => c.torque);
            const consumptionData = cars.map(c => c.consumption);
            const accelData = cars.map(c => c.accel);
            const topSpeedData = cars.map(c => c.topSpeed);
            const co2Data = cars.map(c => c.co2);
            const scoreData = cars.map(c => c.score);

            const metrics = {
                'قدرت (hp)': { data: powerData, unit: 'hp', color: '#e74c3c' },
                'گشتاور (Nm)': { data: torqueData, unit: 'Nm', color: '#3498db' },

                'حداکثر سرعت (km/h)': { data: topSpeedData, unit: 'km/h', color: '#9b59b6' },
                'CO₂ (g/km)': { data: co2Data, unit: 'g/km', color: '#e67e22' },
                'امتیاز (/۱۰)': { data: scoreData, unit: '/10', color: '#1abc9c' },
            };

            const metricKeys = Object.keys(metrics);
            let activeMetric = metricKeys[0];

            // Build UI
            let html = `
                    <div class="analysis-header">
                        <div>
                            <h2>📈 تحلیل عملکرد</h2>
                            <div class="sub">${modelName} · ${cars.length} سال داده</div>

                        ${Object.entries(metrics).map(([key, val]) => {

                            const min = Math.min(...data) || 0;

                                <div class="stat-item">

            const isDark = getTheme() === 'dark';
            const textColor = isDark ? '#f0f0f0' : '#1a1a1a';
            const gridColor = isDark ? '#333' : '#e0e0e0';

            function buildChart(metricKey) {
                const metric = metrics[metricKey];
                const data = metric.data;
                const isScore = metric.unit === '/10';
                const yScale = isScore
                    ? { min: 0, max: 10 }
                    : { beginAtZero: true, suggestedMax: Math.max(...data) * 1.15 || 1 };

                analysisChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: years,
                        datasets: [{
                            label: metricKey,
                            data: data,
                            borderColor: metric.color,
                            backgroundColor: metric.color + '33',
                            fill: true,
                            tension: 0.3,
                            pointRadius: 5,
                            pointHoverRadius: 8,
                            pointBackgroundColor: metric.color,
                            pointBorderColor: isDark ? '#0d0d0d' : '#ffffff',
                            pointBorderWidth: 2,
                            borderWidth: 2.5,
                            spanGaps: true,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: {
                                labels: { color: textColor, font: { family: 'Vazir', size: 13 } }
                            },
                            tooltip: {
                                mode: 'index',
                                intersect: false,
                                titleFont: { family: 'Vazir' },
                                bodyFont: { family: 'Vazir' },
                                callbacks: {
                                    title: function(items) {
                                        return 'سال ' + items[0].label;
                                    },
                                    label: function(context) {
                                        const val = context.parsed.y;
                                        const formatted = Number.isInteger(val) ? val : val.toFixed(1);
                                        return context.dataset.label + ': ' + formatted + ' ' + (metric.unit || '');
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                ticks: { color: textColor, font: { family: 'Vazir' } },
                                grid: { color: gridColor },
                                title: { display: true, text: 'سال', color: textColor, font: { family: 'Vazir' } }
                            },
                            y: {
                                ...yScale,
                                ticks: {
                                    color: textColor,
                                    font: { family: 'Vazir' },
                                    stepSize: isScore ? 1 : undefined,
                                },
                                grid: { color: gridColor },
                                title: { display: true, text: metric.unit || '', color: textColor,
                                font: { family: 'Vazir' } }
                            }
                        }
                    }
                });
            }

            buildChart(activeMetric);

            // --- Metric selector events ---
            document.querySelectorAll('#metricSelector .btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#metricSelector .btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const key = this.dataset.metric;
                    activeMetric = key;
                    if (analysisChart) {
                        const metric = metrics[key];
                        const isScore = metric.unit === '/10';
                        analysisChart.data.datasets[0].label = key;
                        analysisChart.data.datasets[0].data = metric.data;
                        analysisChart.data.datasets[0].borderColor = metric.color;
                        analysisChart.data.datasets[0].backgroundColor = metric.color + '33';
                        analysisChart.data.datasets[0].pointBackgroundColor = metric.color;
                        analysisChart.options.scales.y.title.text = metric.unit || '';
                        // بازتنظیم دقیق محور Y متناسب با شاخص جدید
                        if (isScore) {
                            analysisChart.options.scales.y.min = 0;
                            analysisChart.options.scales.y.max = 10;
                            analysisChart.options.scales.y.beginAtZero = undefined;
                            analysisChart.options.scales.y.suggestedMax = undefined;
                            analysisChart.options.scales.y.ticks.stepSize = 1;
                        } else {
                            analysisChart.options.scales.y.min = undefined;
                            analysisChart.options.scales.y.max = undefined;
                            analysisChart.options.scales.y.beginAtZero = true;
                            analysisChart.options.scales.y.suggestedMax = Math.max(...metric.data) * 1.15 || 1;
                            analysisChart.options.scales.y.ticks.stepSize = undefined;
                        }
                        analysisChart.update();
                    }
                });
            });
        }

        // ================================================================
        //  INIT
        // ================================================================
        async function init() {
            const ok = await loadData();
            if (ok) {
                renderHome();
            }
            // set initial theme
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        // expose to global for inline onclick
        window.navigateTo = navigateTo;
        window.toggleTheme = toggleTheme;

        // start
        init();
    </script>

</body>
</html>
